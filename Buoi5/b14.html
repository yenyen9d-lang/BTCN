
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Tính chỉ số BMI</title>
</head>
<body>
    <h2>Tính chỉ số BMI</h2>

    <label>Nhập cân nặng (kg):</label>
    <input type="number" id="canNang" step="any">
    <br><br>

    <label>Nhập chiều cao (m):</label>
    <input type="number" id="chieuCao" step="any">
    <br><br>

    <button onclick="tinhBMI()">Tính BMI</button>

    <p id="ketQua"></p>

    <script>
        function tinhBMI() {
            let canNang = Number(
                document.getElementById("canNang").value
            );

            let chieuCao = Number(
                document.getElementById("chieuCao").value
            );

            let ketQua = document.getElementById("ketQua");

            if (
                document.getElementById("canNang").value === "" ||
                document.getElementById("chieuCao").value === "" ||
                canNang <= 0 ||
                chieuCao <= 0
            ) {
                ketQua.innerHTML =
                    "Vui lòng nhập cân nặng và chiều cao hợp lệ!";
                return;
            }

            let bmi = canNang / (chieuCao * chieuCao);
            let phanLoai = "";

            if (bmi < 18.5) {
                phanLoai = "Thiếu cân";
            } else if (bmi < 25) {
                phanLoai = "Bình thường";
            } else if (bmi < 30) {
                phanLoai = "Thừa cân";
            } else {
                phanLoai = "Béo phì";
            }

            ketQua.innerHTML =
                "Chỉ số BMI: " + bmi.toFixed(2) +
                "<br>Phân loại: " + phanLoai;
        }
    </script>
</body>
</html>
