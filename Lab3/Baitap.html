<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nested.html</title>
</head>
<body>

    <table border="1" cellpadding="5" cellspacing="5" width="700">
        <tr align="center" valign="middle">
            <th bgcolor="#00cccc"><h2>Device</h2></th>
            <th bgcolor="#00cccc"><h2>Brand</h2></th>
            <th bgcolor="#00cccc"><h2>Specifications</h2></th>
        </tr>
        <tr align="center" valign="middle">
            <td rowspan="1" align="center"><h3>Smartphone</h3></td>
            <td><h3>Apple</h3></td>
            <td>
                <table border="1" width="100%" cellpadding="5" cellspacing="3">
                    <tr align="center" valign="middle">
                        <th bgcolor="#ffcc33"><h3>Model</h3></th>
                        <th bgcolor="#ffcc33"><h3>Storage</h3></th>
                    </tr>
                    <tr align="center" valign="middle">
                        <td><h3>iPhone 12 Pro</h3></td>
                        <td><h3>256GB</h3></td>
                    </tr>
                    <tr align="center" valign="middle">
                        <td><h3>iPhone SE</h3></td>
                        <td><h3>128GB</h3></td>
                    </tr>
                </table>
            </td>
        </tr>
        <tr align="center" valign="middle">
            <td><h3>Laptop</h3></td>
            <td><h3>HP</h3></td>
            <td><h3>15.6" Display</h3></td>
        </tr>
        <tr align="center" valign="middle">
            <td><h3>Tablet</h3></td>
            <td><h3>Samsung</h3></td>
            <td><h3>10.5" Display</h3></td>
        </tr>
    </table>

</body>
</html>
