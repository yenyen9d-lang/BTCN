<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Registration Form</h2>
    <table>
        <form>
            <tr>
                <td>
                    <label for="">First Name</label>
                </td>
                <td>
                    <input type="text" placeholder="Enter First Name">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="">Last Name</label>
                </td>
                <td>
                    <input type="text" placeholder="Enter Last Name">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="">Email :</label>
                </td>
                <td>
                    <input type="text" placeholder="Enter Email Adddress">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="">Password :</label>
                </td>
                <td>
                    <input type="password">
                </td>
            </tr>
            <tr>
                <td><label for="">Gender :</label></td>
                <td>
                    <label><input name="role" type="radio">Male</label> <br>
                    <label><input name="role" type="radio">Female</label> <br>
                    <label><input name="role" type="radio">Other</label> <br>
                </td>
            </tr>
            <tr>
                <td><label for="age">Age :</label></td>
                <td>
                    <input type="number" id="age" name="age" min="17" max="100" value="18" style="width: 70px; padding: 4px;">
                </td>
            </tr>
            <tr>
                <td><label for="">Preferences :</label></td>
                <td>
                    <label><input type="checkbox">Acrylic Painting</label> <br>
                    <label><input type="checkbox">Oil Painting</label> <br>
                    <label><input type="checkbox">Water Color Painting</label> <br>
                </td>
            </tr>
            <tr>
                <td><label for="">Select Occupation :</label></td>
                <td>
                    <select>
                        <option>Student</option>
                        <option>Staff</option>
                        <option>Manager</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>Bio</td>
                <td><textarea >Share few lines about yourself...</textarea></td>
            </tr>
            <tr>
                <td></td>
                <td>
                    <input type="submit" value="RESET">
                    <input type="reset" value="SUBMIT">
                </td>
        </form>
    </table>
</body>
</html>
</body>
</html>
