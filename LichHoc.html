<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Lịch học</title>
</head>

<body>

<center>

    <h1>LỊCH HỌC</h1>

    <table border="1" cellspacing="0" cellpadding="8"
           width="850">

        <!-- HÀNG TIÊU ĐỀ -->
        <tr>
            <th>Thứ</th>
            <th>Hai</th>
            <th>Ba</th>
            <th>Tư</th>
            <th>Năm</th>
            <th>Sáu</th>
        </tr>


        <!-- ==================== -->
        <!--        BUỔI SÁNG      -->
        <!-- ==================== -->

        <tr>

            <!-- Sáng chiếm 2 hàng -->
            <td rowspan="2" align="center">
                Sáng
            </td>

            <!-- Thứ Hai -->
            <td align="center">
                LTHĐT
            </td>

            <!-- Thứ Ba chiếm 2 hàng -->
            <td rowspan="2" align="center">
                CTDL-GT
            </td>

            <!-- Thứ Tư chiếm 2 hàng -->
            <td rowspan="2" align="center">
                PTHT
            </td>

            <!-- Thứ Năm -->
            <td align="center">
                CSDL
            </td>

            <!-- Thứ Sáu chiếm 2 hàng -->
            <td rowspan="2" align="center">
                CSDL
            </td>

        </tr>


        <!-- Sáng - hàng thứ 2 -->

        <tr>

            <!-- Thứ Hai -->
            <td align="center">
                LTW
            </td>

            <!-- Thứ Năm -->
            <td align="center">
                LTW
            </td>

        </tr>


        <!-- ==================== -->
        <!--       BUỔI CHIỀU      -->
        <!-- ==================== -->

        <tr>

            <!-- Chiều chiếm 2 hàng -->
            <td rowspan="2" align="center">
                Chiều
            </td>

            <!-- Thứ Hai -->
            <td align="center">
                TĐTT
            </td>

            <!-- Thứ Ba -->
            <td align="center">
                QTM
            </td>

            <!-- Thứ Tư -->
            <td align="center">
                TRR
            </td>

            <!-- Thứ Năm + Thứ Sáu -->
            <td colspan="2" align="center">
                TĐTT
            </td>

        </tr>


        <!-- Chiều - hàng thứ 2 -->

        <tr>

            <!-- Thứ Hai + Thứ Ba -->
            <td colspan="2" align="center">
                AV
            </td>

            <!-- Thứ Tư -->
            <td align="center">
                CSDL
            </td>

            <!-- Thứ Năm + Thứ Sáu -->
            <td colspan="2" align="center">
                CNTT CB
            </td>

        </tr>

    </table>

</center>

</body>
</html>
